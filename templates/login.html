{% extends "base.html" %}
{% block title %}Login Admin{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[50vh] sm:min-h-[55vh]">
    <div class="w-full max-w-sm">
        <div class="text-center mb-5">
            <div class="w-11 h-11 rounded-lg bg-primary flex items-center justify-center mx-auto mb-3 text-primary-content text-lg font-semibold">
                D
            </div>
            <h1 class="font-display text-xl text-base-content">Login Admin</h1>
            <p class="text-base-content/50 text-[13px] mt-0.5">Dishub Kota Bogor</p>
        </div>

        <div class="neo-card p-4 sm:p-6">
            <form method="POST" action="{{ url_for('admin.login') }}">
                <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="block text-[13px] font-medium text-base-content mb-1">Username</label>
                    <input type="text" name="username" placeholder="Username" required autofocus
                           class="input w-full text-sm">
                </div>
                <div class="mb-4">
                    <label class="block text-[13px] font-medium text-base-content mb-1">Password</label>
                    <input type="password" name="password" placeholder="Password" required
                           class="input w-full text-sm">
                </div>
                <button type="submit" class="btn w-full bg-primary hover:opacity-90 text-primary-content border-none text-sm font-semibold">
                    Masuk
                </button>
            </form>
        </div>

        <div class="text-center mt-4">
            <a href="{{ url_for('public.form_cuti') }}" class="text-xs text-base-content/50 hover:text-primary transition-colors">
                &larr; Kembali
            </a>
        </div>
    </div>
</div>
{% endblock %}

# Railway runs Nixpacks v1.41.0. Without this file Nixpacks sees the
# package.json in the repo root and picks the Node.js provider, so the build
# only runs `npm ci` and never `pip install`. Both gunicorn and waitress then
# fail with "command not found" and the container restart-loops into a 502.
#
# Pinning the provider and the install phase makes the Python dependency set
# explicit instead of relying on Nixpacks' file-based detection.

[phases.setup]
# python311 from nixpkgs does NOT bundle pip ("No module named pip"), so pip
# itself has to come from nixpkgs too. `python -m pip` cannot bootstrap pip.
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
# Use the `pip` binary from the nix profile rather than `python -m pip`.
cmds = ["pip install --no-cache-dir -r requirements.txt"]

[start]
cmd = "waitress-serve --host=0.0.0.0 --port=$PORT --threads=4 app:app"